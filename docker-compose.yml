version: '3.8'

services:
  inference:
    build:
      context: ./services/inference
      dockerfile: Dockerfile
    container_name: trinetra-inference
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - TRINETRA_ENVIRONMENT=production
    volumes:
      - ./ml:/ml
      - ./data:/data
      - ./services/inference/Dockerfile:/services/inference/Dockerfile:ro
      - ./apps/web/Dockerfile:/apps/web/Dockerfile:ro
      - ./docker-compose.yml:/docker-compose.yml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - trinetra-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: trinetra-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_INFERENCE_URL=http://inference:8000
    depends_on:
      inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - trinetra-net

networks:
  trinetra-net:
    driver: bridge
